name: Deploy Karofi FC WebApp to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Chỉ cần dependency của client để build. Gói ở thư mục gốc chỉ chứa
      # clasp — công cụ deploy backend Apps Script, không tham gia build.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/package-lock.json

      # npm ci cài đúng theo lockfile và nhanh hơn npm install
      - name: Install Client Dependencies
        run: npm ci
        working-directory: client

      - name: Lint Client
        run: npm run lint
        working-directory: client

      - name: Build Vite Client
        run: npm run build
        working-directory: client

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'client/dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
